version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use
        - npm ci
    build:
      commands:
        # Static export: only NEXT_PUBLIC_* values are needed at build time.
        # Secret keys are not used by the CDN-hosted site (see /server for optional webhook).
        - cp .env.example .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - npm run build
  artifacts:
    # next.config.ts sets output: "export" → HTML/CSS/JS in out/
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
